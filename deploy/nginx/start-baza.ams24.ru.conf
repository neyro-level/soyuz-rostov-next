limit_req_zone $binary_remote_addr zone=ams_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ams_leads:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ams_internal:10m rate=30r/m;

server {
    listen 80;
    server_name start-baza.ams24.ru;

    # INDEXING_POLICY=noindex (must match src/project/indexing-policy.ts)
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Strict-Transport-Security is emitted by Next.js so HSTS_PRELOAD remains an explicit app opt-in.

    location /media/ {
        alias /var/lib/ams/realtbase/media/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /admin/login {
        limit_req zone=ams_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/login {
        limit_req zone=ams_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/public/leads {
        limit_req zone=ams_leads burst=10 nodelay;
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/internal/ {
        limit_req zone=ams_internal burst=10 nodelay;
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
